<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Signing in…</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; align-items: center;
           justify-content: center; height: 100vh; margin: 0; background: #f2f1ee; color: #1a1918; }
    p { font-size: 15px; text-align: center; line-height: 1.5; }
  </style>
</head>
<body>
  <p id="m">Completing sign-in…</p>
  <script>
    const hash  = new URLSearchParams(window.location.hash.slice(1));
    const token = hash.get('access_token');
    const error = hash.get('error');
    const msg   = { type: 'sargama_auth_token' };
    if (token) {
      msg.token = token;
      document.getElementById('m').textContent = 'Sign-in complete. This window will close.';
    } else {
      msg.error = error || 'unknown_error';
      document.getElementById('m').textContent = 'Sign-in was not allowed. You can close this window.';
    }
    if (window.opener && !window.opener.closed) {
      try { window.opener.postMessage(msg, window.location.origin); } catch (_) {}
      // Close the popup regardless of success or error (important for prompt=none silent flow)
      setTimeout(() => window.close(), 400);
    }
  </script>
</body>
</html>
